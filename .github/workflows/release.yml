name: Build and release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-baseline
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            platform: linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64-baseline
            platform: macos-x64
          - runner: macos-latest
            target: bun-darwin-arm64
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build --target=${{ matrix.target }}
      - run: bun scripts/smoke-binary.ts
      - name: Package binary
        run: tar -czf dist/review-${{ matrix.platform }}.tar.gz -C dist codereview-ui
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.platform }}
          path: dist/review-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: review-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum review-*.tar.gz > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" review-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" review-*.tar.gz SHA256SUMS --verify-tag --generate-notes
          fi
